---
# Copy to group_vars/all.yml and edit. group_vars/all.yml is gitignored.
# 设计:全 VM、双 KVM host、control-plane 兼 ODF(在 control-storage host)、
#       worker 在 cnv-compute host 用 host-passthrough 跑嵌套 CNV、本地 LVMS。

# ── Cluster identity ─────────────────────────────────────────────────────────
cluster_name:        ocp
base_domain:         lan               # api.{{cluster_name}}.{{base_domain}} / *.apps...
openshift_version:   "4.16.20"         # ⚠️ X.Y.Z 精确补丁,非 channel 形;以 assisted /openshift-versions 为准
cpu_architecture:    x86_64

# ── Topology(全 VM;3 master 兼 ODF + N worker 跑 CNV)──────────────────────────
control_plane_count: 3
masters_schedulable: true              # compact:master 可调度 + 兼 ODF 存储节点
worker_count:        2                 # cnv-compute host 上的 CNV worker 数

# ── Install method × connectivity(两轴)───────────────────────────────────────
installation_method: assisted          # assisted | agent-based(ABI, 规划中)
connectivity:        online            # online=SaaS api.openshift.com | offline=本地 assisted-service
assisted_saas_url:   https://api.openshift.com/api/assisted-install/v2
assisted_onprem_url: "http://{{ hostvars[groups['kvm_host'][0]].ansible_host }}:8090/api/assisted-install/v2"
sso_url:             https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token

# ── 网络(双网:1G 管理/API + 10G 存储/迁移)────────────────────────────────────
# machine network:节点 NIC1,装机/API/外部访问;多节点 assisted 自带 keepalived VIP
machine_network_cidr: 192.168.1.0/24
machine_bridge:       br-lan           # 桥到 host 的 1G 口(eno*);Phase 10 建
machine_dns:          192.168.1.1      # 节点用的 DNS(一般=路由器/网关);preflight 查它而非 driver 的 resolver
api_vip:              192.168.1.200    # ← 空闲且不在路由器 DHCP 段
ingress_vip:          192.168.1.201    # ← 空闲且不在 DHCP 段
# storage/migration network:节点 NIC2,ODF 复制 + CNV 热迁移(10G 线速)
storage_network_cidr: 10.10.0.0/24
storage_mtu:          9000             # 建议两端统一 9000(实测:不统一 TCP 也线速,仅优化)
# DNS 预置(Phase 00 校验):api.<c>.<b>→api_vip;*.apps.<c>.<b>→ingress_vip
# machine network 上 VM 网卡怎么接 host 的 1G 口:
#   macvtap(默认,安全)= Phase 40 用 type=direct,source_mode=bridge,不动主机主网卡
#   bridge            = Phase 10 在 machine_nic 上建 Linux 桥 br-lan(有断连风险,谨慎)
machine_net_mode:     macvtap
unify_storage_mtu:    false            # true 时 Phase 10 把存储网桥 MTU 拉到 storage_mtu(rhel10 1500→9000)
# 装机时给 VM 挂第二块存储网卡?若存储网与 machine 网同广播域,双网卡会让 assisted 报
# non-overlapping-subnets。装机建议 false(只挂 machine 单网卡),10.10 存储网 Day2 用 NMState 加。
attach_storage_nic:   false
# ★安装盘由人显式决定(非 assisted 自动挑最大盘):指定 OS 盘名。多盘节点(OS+ODF/LVMS)
#   必须设成 OS 盘,否则 RHCOS 装到数据盘。可在 nodes 里加 idisk 覆盖单节点。
install_disk_name:    vda

# ── OpenShift 集群网络 / ISO(Phase 20/30 用)──────────────────────────────────
network_type:            OVNKubernetes
cluster_network_cidr:    10.128.0.0/14
cluster_network_host_prefix: 23
service_network_cidr:    172.30.0.0/16
image_type:              minimal-iso   # minimal-iso(小,运行时拉根)| full-iso(离线更稳)
additional_ntp_sources:  ""            # 建议填内网 NTP(如路由器 192.168.1.1)——时钟偏移是 assisted 校验/CSI 常见坑

# ── VM 规格 ──────────────────────────────────────────────────────────────────
master_vcpu:      8
master_ram_mib:   24576
master_disk_gib:  120                  # OS 盘;OSD 盘另给(见 osd_disks)
worker_vcpu:      16
worker_ram_mib:   32768
worker_disk_gib:  120                  # OS 盘
worker_data_disk_gib: 800              # 本地 LVMS 数据盘(pool 上 qcow2 thin;masters 的 OSD 走 osd_disks 裸盘直通)
worker_cpu_mode:  host-passthrough     # ★嵌套 CNV 必须:把 vmx 透传进 worker VM

# ── 存储 ─────────────────────────────────────────────────────────────────────
odf_enabled:      true                 # OSD = 各 control-storage master 挂 1 块 osd_disks(host var)
odf_replica:      3
odf_min_size:     2                    # 关 cnv-compute host 时 ODF 仍可用(本设计 ODF 全在 cp host,不受影响)
lvms_enabled:     true                 # cnv-compute host 的 local_storage_disk → 本地 storage class(给钉住的 CNV 虚机)

# ── 凭据(只走 env/文件,永不进仓库)──────────────────────────────────────────
pull_secret_file:   "{{ lookup('env', 'HOME') }}/.pull-secret.json"
ssh_pub_key_file:   "{{ lookup('env', 'HOME') }}/.ssh/id_rsa.pub"
offline_token_file: "{{ lookup('env', 'HOME') }}/.openshift/offline-token"   # 仅 online 需要

output_dir:         "{{ lookup('env', 'HOME') }}/openshift-install/{{ cluster_name }}"
