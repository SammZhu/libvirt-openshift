---
# Static inventory — 3 machines, 3 roles.
#   local           — RHEL8 Ansible 控制节点 (= srv-down). 跑所有 phase / assisted API
#                     调用 / DNS+token 校验. 不装节点.
#   kvm_host        — RHEL9 rhdemo. libvirt KVM host, 承载 control-plane VM (+可选 VM worker).
#                     虚拟化/嵌套虚拟化/容量/pool 检查 + virt-install 在此 (over SSH).
#   baremetal_nodes — RHEL10 OpenShiftV. 物理裸金属 worker, 加入同集群: 裸盘→ODF, 原生虚拟化→CNV.
#                     裸盘/容量/虚拟化 检查在此; 从 discovery ISO 走虚拟介质/USB/PXE 引导.
all:
  hosts:
    local:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    kvm_host:
      hosts:
        rhel9-rhdemo:
          ansible_host: 10.0.0.9           # ← RHEL9 rhdemo IP
          ansible_user: root               # ← user with libvirt access
          # ansible_ssh_private_key_file: ~/.ssh/id_rsa
    baremetal_nodes:
      hosts:
        rhel10-openshiftv:
          ansible_host: 10.0.0.10          # ← RHEL10 physical worker IP
          ansible_user: root
          node_role: worker                # 加入集群的角色
          odf_devices: []                  # ← ODF 用的裸盘, e.g. [/dev/sdb, /dev/sdc]
