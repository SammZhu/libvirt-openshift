---
# Phase 40 — virt-install 起 OpenShift 节点 VM(B 方案:节点表驱动 + 双网卡钉 MAC).
#   节点来自 group_vars `nodes`(按 host 过滤):master 在 rhdemo(OSD 裸盘直通),worker 在 rhel10(host-passthrough+LVMS)。
#   两网卡钉死 MAC:eth0=machine(macvtap→machine_nic,node.mmac)/ eth1=storage(br-ovs 10G,node.smac);
#   MAC 与 infra-env static_network_config(Phase 25)对应,静态 IP 由 ISO 内 NMState 下发。
#   --boot hd,cdrom(空盘→先引导 ISO,装完→引导硬盘)。幂等:同名域存在则跳过。
- name: Phase 40 — virt-install 节点 VM
  hosts: kvm_host
  gather_facts: false
  become: true
  tasks:
    - name: 查 pool 路径
      ansible.builtin.shell: "virsh -c qemu:///system pool-dumpxml {{ vm_pool }} | grep -oP '(?<=<path>)[^<]+'"
      changed_when: false
      register: _pp

    - name: 设 pool 路径 + iso 路径
      ansible.builtin.set_fact:
        _poolpath: "{{ _pp.stdout | trim }}"
        iso_path: "{{ (_pp.stdout | trim) }}/{{ cluster_name }}-discovery.iso"

    - name: 断言 ISO 已下(先跑 Phase 30)
      ansible.builtin.stat:
        path: "{{ iso_path }}"
      register: _iso
      failed_when: not _iso.stat.exists

    - name: 现有域清单
      ansible.builtin.command: "virsh -c qemu:///system list --all --name"
      changed_when: false
      register: _doms

    - name: virt-install 节点 VM(双网卡钉 MAC:eth0 machine / eth1 10G storage)
      ansible.builtin.shell: |
        virt-install --connect qemu:///system --name {{ cluster_name }}-{{ node.name }} \
          --vcpus {{ master_vcpu if node.role == 'master' else worker_vcpu }} \
          --memory {{ master_ram_mib if node.role == 'master' else worker_ram_mib }} \
          --cpu {{ 'host-passthrough' if node.role == 'master' else worker_cpu_mode }} \
          --disk path={{ _poolpath }}/{{ cluster_name }}-{{ node.name }}.qcow2,size={{ master_disk_gib if node.role == 'master' else worker_disk_gib }},format=qcow2,bus=virtio,cache={{ disk_cache }} \
          {% if node.role == 'master' %}--disk path={{ node.osd }},bus=virtio{% else %}--disk path={{ _poolpath }}/{{ cluster_name }}-{{ node.name }}-data.qcow2,size={{ worker_data_disk_gib }},format=qcow2,bus=virtio,cache={{ disk_cache }}{% endif %} \
          --disk path={{ iso_path }},device=cdrom \
          --network type=direct,source={{ machine_nic }},source_mode=bridge,model=virtio,mac={{ node.mmac }} \
          --network type=bridge,source={{ storage_bridge }},virtualport_type=openvswitch,model=virtio,mac={{ node.smac }} \
          --boot hd,cdrom --os-variant rhel9.4 --graphics vnc --noautoconsole
      args:
        executable: /bin/bash
      loop: "{{ install_nodes | selectattr('host', 'equalto', inventory_hostname) | list }}"
      loop_control:
        loop_var: node
        label: "{{ node.name }} ({{ node.mip }} / {{ node.sip }})"
      when: (cluster_name ~ '-' ~ node.name) not in (_doms.stdout_lines | map('trim') | list)
      register: _mk
      changed_when: _mk.rc == 0

    - name: Phase 40 done
      ansible.builtin.debug:
        msg: >-
          ✓ {{ inventory_hostname }}: {{ (install_nodes | selectattr('host', 'equalto', inventory_hostname) | list) | map(attribute='name') | join(', ') }}
          已定义/启动(双网卡钉 MAC,静态 IP 由 ISO NMState 下发)→ Phase 50 看注册
