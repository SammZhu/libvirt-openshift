---
# Phase 50 — 等所有节点注册 → 按 machine MAC 匹配 nodes 表设角色+主机名 → 等集群 ready.
#   ★必须显式设角色:rhdemo 三台(带 ODF 裸盘)=master,rhel10 两台=worker;
#   否则 auto-assign 可能按资源把 rhel10(80c/125G)选成 master,ODF 盘就不在 master 上了。
- name: Phase 50 — 角色/主机名 + 就绪
  hosts: local
  gather_facts: false
  tasks:
    - name: Resolve Assisted base URL + auth
      ansible.builtin.include_tasks: ../tasks/assisted_base.yml
    - name: Load state
      ansible.builtin.include_tasks: ../tasks/load_state.yml

    - name: 等所有节点注册({{ nodes | length }} 台)
      ansible.builtin.uri:
        url: "{{ assisted_base_url }}/clusters/{{ cluster_id }}/hosts"
        headers: "{{ assisted_headers }}"
      register: _h
      until: (_h.json | length) >= (nodes | length)
      retries: 30
      delay: 20

    - name: 取每 host 详情(list 不含 inventory,需单独 GET)
      ansible.builtin.uri:
        url: "{{ assisted_base_url }}/infra-envs/{{ infra_env_id }}/hosts/{{ host.id }}"
        headers: "{{ assisted_headers }}"
      register: _full
      loop: "{{ _h.json }}"
      loop_control:
        loop_var: host
        label: "{{ host.id[0:8] }}"

    - name: 按 machine MAC 匹配 host ↔ node(+ 选 vda 为安装盘)
      ansible.builtin.set_fact:
        _pairs: "{{ _pairs | default([]) + [{'hid': item.json.id, 'role': _node.role, 'name': _node.name, 'disk': _vda}] }}"
      loop: "{{ _full.results }}"
      loop_control:
        loop_var: item
        label: "{{ item.json.id[0:8] }}"
      vars:
        _inv: "{{ item.json.inventory | from_json }}"
        _macs: "{{ _inv.interfaces | map(attribute='mac_address') | list }}"
        _node: "{{ nodes | selectattr('mmac', 'in', _macs) | first }}"
        # ★安装盘由配置显式决定(install_disk_name,或 node.idisk 覆盖);不用 assisted 自动选(会挑最大盘)
        _dname: "{{ _node.idisk | default(install_disk_name) }}"
        _vda: "{{ _inv.disks | selectattr('name', 'equalto', _dname) | map(attribute='id') | first }}"
      when: (item.json.inventory | default('')) | length > 0

    - name: 设角色 + 主机名(PATCH host)
      ansible.builtin.uri:
        url: "{{ assisted_base_url }}/infra-envs/{{ infra_env_id }}/hosts/{{ item.hid }}"
        method: PATCH
        headers: "{{ assisted_headers | combine({'Content-Type': 'application/json'}) }}"
        body_format: json
        body:
          host_role: "{{ item.role }}"
          host_name: "{{ item.name }}"
          disks_selected_config:
            - id: "{{ item.disk }}"
              role: install
        status_code: [201]
      loop: "{{ _pairs }}"
      loop_control:
        label: "{{ item.name }} => {{ item.role }} (install→{{ item.disk | basename }})"

    - name: 等集群 ready(角色定完重新校验)
      ansible.builtin.uri:
        url: "{{ assisted_base_url }}/clusters/{{ cluster_id }}"
        headers: "{{ assisted_headers }}"
      register: _c
      until: _c.json.status == 'ready'
      retries: 20
      delay: 15

    - name: Phase 50 done
      ansible.builtin.debug:
        msg: "✓ 角色/主机名已设;集群 status={{ _c.json.status }} → 可 Phase 60 安装"
