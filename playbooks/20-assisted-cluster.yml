---
# Phase 20 — 建 Assisted cluster + infra-env(v2 REST).
# online: SaaS api.openshift.com(Bearer)/ offline: 本地 assisted-service —— 由 tasks/assisted_base.yml 决定.
# 幂等:state.yml 里已有 cluster_id/infra_env_id 则跳过创建.
- name: Phase 20 — Assisted cluster + infra-env
  hosts: local
  gather_facts: false
  tasks:
    - name: Resolve Assisted base URL + auth
      ansible.builtin.include_tasks: ../tasks/assisted_base.yml

    - name: Load pipeline state
      ansible.builtin.include_tasks: ../tasks/load_state.yml

    - name: Read pull secret
      ansible.builtin.slurp:
        src: "{{ pull_secret_file }}"
      register: _ps_slurp
      no_log: true

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ ssh_pub_key_file }}"
      register: _key_slurp

    - name: Set secrets as facts
      ansible.builtin.set_fact:
        # ★| string:阻止 jinja2_native 把 JSON 形 pull_secret literal_eval 成 dict(→ NativeJinjaUnsafeText 字符串)
        _pull_secret: "{{ (_ps_slurp.content | b64decode | trim) | string }}"
        _ssh_key: "{{ (_key_slurp.content | b64decode | trim) | string }}"
      no_log: true

    # ── 建 cluster ──
    - name: 建 Assisted cluster
      ansible.builtin.uri:
        url: "{{ assisted_base_url }}/clusters"
        method: POST
        headers: "{{ assisted_headers | combine({'Content-Type': 'application/json'}) }}"
        body_format: json
        body:
          name: "{{ cluster_name }}"
          openshift_version: "{{ openshift_version }}"
          base_dns_domain: "{{ base_domain }}"
          cpu_architecture: "{{ cpu_architecture }}"
          high_availability_mode: "{{ 'Full' if (control_plane_count | int) > 1 else 'None' }}"
          schedulable_masters: "{{ masters_schedulable | bool }}"
          user_managed_networking: false        # cluster-managed → keepalived VIP,无需外部 LB
          network_type: "{{ network_type }}"
          cluster_networks: "{{ [{'cidr': cluster_network_cidr, 'host_prefix': cluster_network_host_prefix | int}] }}"
          service_networks: [{cidr: "{{ service_network_cidr }}"}]
          machine_networks: [{cidr: "{{ machine_network_cidr }}"}]
          api_vips: [{ip: "{{ api_vip }}"}]
          ingress_vips: [{ip: "{{ ingress_vip }}"}]
          additional_ntp_source: "{{ additional_ntp_sources }}"
          pull_secret: "{{ _pull_secret | string }}"   # ★| string:保持字符串(jinja2_native 否则把 JSON 串 eval 成 dict)
          ssh_public_key: "{{ _ssh_key }}"
        status_code: [201]
        return_content: true
      register: _cluster
      no_log: true                              # 请求 body 带 pull_secret → 整条 no_log
      failed_when: false                        # 不中止,交给下面 surface(只打响应体,无 secret)
      when: cluster_id is not defined

    - name: 建 cluster 出错则 surface(仅响应体,无 secret)
      ansible.builtin.fail:
        msg: "cluster 创建失败 status={{ _cluster.status | default('?') }}: {{ _cluster.json | default(_cluster.content) | default('(无响应体)') }}"
      when:
        - cluster_id is not defined
        - _cluster.status is defined
        - _cluster.status != 201

    - name: 记录 cluster_id
      ansible.builtin.set_fact:
        cluster_id: "{{ _cluster.json.id }}"
      when: cluster_id is not defined

    # ── 建 infra-env(生成 discovery ISO 的载体)──
    - name: 建 infra-env
      ansible.builtin.uri:
        url: "{{ assisted_base_url }}/infra-envs"
        method: POST
        headers: "{{ assisted_headers | combine({'Content-Type': 'application/json'}) }}"
        body_format: json
        body:
          name: "{{ cluster_name }}-infra"
          openshift_version: "{{ openshift_version }}"
          cpu_architecture: "{{ cpu_architecture }}"
          cluster_id: "{{ cluster_id }}"
          image_type: "{{ image_type }}"
          additional_ntp_sources: "{{ additional_ntp_sources }}"
          pull_secret: "{{ _pull_secret | string }}"   # ★| string:保持字符串(jinja2_native 否则把 JSON 串 eval 成 dict)
          ssh_authorized_key: "{{ _ssh_key }}"
        status_code: [201]
        return_content: true
      register: _infra
      no_log: true
      failed_when: false
      when: infra_env_id is not defined

    - name: 建 infra-env 出错则 surface(仅响应体)
      ansible.builtin.fail:
        msg: "infra-env 创建失败 status={{ _infra.status | default('?') }}: {{ _infra.json | default(_infra.content) | default('(无响应体)') }}"
      when:
        - infra_env_id is not defined
        - _infra.status is defined
        - _infra.status != 201

    - name: 记录 infra_env_id
      ansible.builtin.set_fact:
        infra_env_id: "{{ _infra.json.id }}"
      when: infra_env_id is not defined

    # ── 持久化 ──
    - name: 保存 state(cluster_id / infra_env_id)
      ansible.builtin.include_tasks: ../tasks/save_state.yml
      vars:
        new_state:
          cluster_id: "{{ cluster_id }}"
          infra_env_id: "{{ infra_env_id }}"

    - name: Phase 20 done
      ansible.builtin.debug:
        msg: >-
          ✓ cluster={{ cluster_name }} id={{ cluster_id }} | infra_env={{ infra_env_id }}
          | VIP api={{ api_vip }} ingress={{ ingress_vip }} | 下一步 Phase 30 取 discovery ISO
