---
# Phase 90 — 下 kubeconfig + kubeadmin 密码 + console URL 到 output_dir.
- name: Phase 90 — kubeconfig / kubeadmin
  hosts: local
  gather_facts: false
  tasks:
    - name: Resolve Assisted base URL + auth
      ansible.builtin.include_tasks: ../tasks/assisted_base.yml
    - name: Load state
      ansible.builtin.include_tasks: ../tasks/load_state.yml

    - name: 确保 output_dir 存在
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0700"

    - name: 下载 kubeconfig
      ansible.builtin.uri:
        url: "{{ assisted_base_url }}/clusters/{{ cluster_id }}/downloads/credentials?file_name=kubeconfig"
        headers: "{{ assisted_headers }}"
        return_content: true
        dest: "{{ output_dir }}/kubeconfig"
        mode: "0600"
        status_code: [200]

    - name: 取 kubeadmin 密码 + console
      ansible.builtin.uri:
        url: "{{ assisted_base_url }}/clusters/{{ cluster_id }}/credentials"
        headers: "{{ assisted_headers }}"
      register: _cred
      no_log: true

    - name: 写 kubeadmin 密码到文件
      ansible.builtin.copy:
        dest: "{{ output_dir }}/kubeadmin-password"
        content: "{{ _cred.json.password }}"
        mode: "0600"
      no_log: true

    - name: Phase 90 done
      ansible.builtin.debug:
        msg: |
          ✓ 集群凭据已保存到 {{ output_dir }}
            kubeconfig:        {{ output_dir }}/kubeconfig
            kubeadmin 密码:    {{ output_dir }}/kubeadmin-password
            console:           {{ _cred.json.console_url }}
            用户名:            {{ _cred.json.username }}
          登录:export KUBECONFIG={{ output_dir }}/kubeconfig && oc get nodes
